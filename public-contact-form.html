<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Malalaspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000; --surface:#1C1C1E; --surface-alt:#2C2C2E; --border:#38383A;
    --text:#F5F5F7; --text-muted:#98989D; --accent:#0A84FF; --teal:#30D158; --danger:#FF453A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;}
  body{font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;}
  .wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:480px;margin:0 auto;}
  h2{margin:0 0 4px;font-size:19px;}
  .sub{color:var(--text-muted);font-size:13px;margin:0 0 20px;}
  label{display:block;font-size:13px;color:var(--text-muted);margin:14px 0 6px;}
  input,textarea{width:100%;background:var(--surface-alt);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px;font-family:inherit;}
  input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  textarea{resize:vertical;min-height:80px;}
  button{width:100%;margin-top:20px;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  button:hover{background:#2b95ff;}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .msg{margin-top:14px;padding:10px 12px;border-radius:7px;font-size:13px;display:none;}
  .msg.success{display:block;background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.3);color:var(--teal);}
  .msg.error{display:block;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:#ff8a80;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Parlons de votre projet vidéo</h2>
  <p class="sub">Décrivez votre besoin, nous vous répondons rapidement.</p>
  <form id="contact-form">
    <label>Prénom</label>
    <input id="firstName" required />
    <label>Nom</label>
    <input id="lastName" />
    <label>Email *</label>
    <input type="email" id="email" required />
    <label>Téléphone</label>
    <input id="phone" />
    <label>Entreprise</label>
    <input id="company" />
    <label>Votre message *</label>
    <textarea id="message" required placeholder="Décrivez votre projet, votre SaaS, vos besoins..."></textarea>
    <button type="submit" id="submit-btn">Envoyer</button>
    <div class="msg" id="form-msg"></div>
  </form>
</div>
<script>
  document.getElementById('contact-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var msg = document.getElementById('form-msg');
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = 'Envoi en cours...';
    try {
      var res = await fetch('/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          firstName: document.getElementById('firstName').value,
          lastName: document.getElementById('lastName').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          company: document.getElementById('company').value,
          message: document.getElementById('message').value,
          source: 'CONTACT_FORM'
        })
      });
      var data = await res.json();
      if (!res.ok || data.success === false) throw new Error(data.message || 'Une erreur est survenue.');
      msg.textContent = 'Message envoyé ! Nous vous répondons rapidement.';
      msg.classList.add('success');
      document.getElementById('contact-form').reset();
    } catch(err) {
      msg.textContent = err.message || 'Une erreur est survenue. Veuillez réessayer.';
      msg.classList.add('error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Envoyer';
    }
  });
</script>
</body>
</html>
